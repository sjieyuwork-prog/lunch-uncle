name = "lunch-uncle"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Serve the chat page from a plain HTML file, imported as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Static files, such as Uncle's picture, are served from public/. Any
# other path goes to the Worker.
[assets]
directory = "./public"

# Each client IP gets 30 requests a minute, shared by /chat and /places
# (see src/http.js). Bindings that
# share a namespace_id in one Cloudflare account share their counters, so
# give each team's Worker its own number.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Secrets (OPENCODE_API_KEY, GOOGLE_PLACES_API_KEY) are set with
# `wrangler secret put` for deploys and `.env` for local development.
# Never put them in this file.
